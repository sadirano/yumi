<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>yumi</title>
    <!-- Installable, full-screen PWA (no offline/service-worker). Install needs
         an HTTPS secure context (`tailscale serve` or the Cloudflare edge).
         use-credentials: behind an auth gate (Cloudflare Access) the manifest
         is otherwise fetched cookie-less, gets bounced to the login page, and
         the PWA installs with a generic icon. Harmless without a gate. -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <meta name="theme-color" content="#09090b" />
    <!-- iOS standalone: Safari ignores the manifest's display mode and needs
         these explicit meta tags. apple-touch-icon must be a PNG — iOS does
         not render SVG here and falls back to a page screenshot. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="yumi" />
  </head>
  <body class="bg-zinc-950 text-zinc-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
